# Python environment for the Baron-Muraro pilot.
# Create with: conda env create -f environment.yml
name: annotbench-pilot
channels:
  - conda-forge
dependencies:
  - python=3.12.2
  - pip
  - pip:
      - anndata==0.13.4
      - numpy==2.4.6
      - pandas==3.0.6
      - scipy==1.16.0
      - h5py==3.15.1
      - PyYAML==6.0.3
      - GEOparse==2.0.4
      - scanpy==1.12.4
      - scikit-learn==1.7.1
